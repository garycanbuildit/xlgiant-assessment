<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Your Automation Readiness Results | xlGIANT</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "text-heading": "#111827",
                        "text-body": "#374151",
                    },
                    fontFamily: { "display": ["Inter", "sans-serif"] }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .max-w-1200 {
            max-width: 1200px;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* SVG Speedometer Card */
        .gauge-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.10);
            padding: 2rem 2.5rem 1.5rem;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            min-width: 260px;
        }

        .gauge-card svg {
            width: 220px;
            height: auto;
            overflow: visible;
        }

        #needleGroup {
            transform-origin: 110px 110px;
            transform: rotate(-90deg);
            transition: transform 1.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.6s ease forwards;
            opacity: 0;
        }

        .fade-in-delay {
            animation: fadeIn 0.6s ease 0.3s forwards;
            opacity: 0;
        }

        .slide-up {
            animation: slideUp 0.6s ease forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .btn-hover {
            transition: all 0.2s ease;
        }

        .btn-hover:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
        }

        /* Tier colors */
        .tier-systemized {
            color: #10B981;
        }

        .tier-hidden {
            color: #F59E0B;
        }

        .tier-scaling {
            color: #EF4444;
        }

        .tier-systemized-bg {
            background-color: #ECFDF5;
            border-color: #10B981;
        }

        .tier-hidden-bg {
            background-color: #FFFBEB;
            border-color: #F59E0B;
        }

        .tier-scaling-bg {
            background-color: #FEF2F2;
            border-color: #EF4444;
        }

        .tier-systemized-btn {
            background-color: #10B981;
        }

        .tier-hidden-btn {
            background-color: #F59E0B;
        }

        .tier-scaling-btn {
            background-color: #EF4444;
        }
    </style>
</head>

<body class="bg-gray-50 font-display text-text-body">

    <!-- Results Hero -->
    <section class="py-16 bg-gray-50" id="results-hero">
        <div class="max-w-1200 mx-auto px-6">
            <!-- Two-column layout: text left, gauge right -->
            <div class="flex flex-col md:flex-row items-center gap-12">

                <!-- Left: text -->
                <div class="flex-1 text-left">
                    <p class="text-primary font-bold uppercase tracking-widest text-sm mb-3 fade-in">Your Assessment
                        Results</p>
                    <h1 id="resultsHeading"
                        class="text-3xl md:text-4xl font-black text-text-heading mb-3 leading-tight fade-in"></h1>
                    <p id="nameGreeting" class="text-lg font-semibold text-primary mb-4 fade-in"></p>
                    <p id="resultsSubheading" class="text-base text-gray-500 leading-relaxed fade-in-delay"></p>
                </div>

                <!-- Right: score card -->
                <div class="flex-shrink-0 slide-up">
                    <div class="gauge-card justify-center">
                        <p class="text-sm font-bold uppercase tracking-widest text-gray-400 mt-4 mb-2">Your Leak Score
                        </p>
                        <p id="scoreNumber" class="text-7xl font-black my-4" style="color:#111827;">0</p>
                        <p class="text-sm text-gray-400 font-semibold mb-4">out of 60</p>
                        <div id="tierBadge"
                            class="inline-flex items-center gap-2 px-6 py-2 rounded-full border-2 font-bold text-sm mt-3">
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- YouTube Video Section -->
    <section class="py-16 bg-gray-100">
        <div class="max-w-3xl mx-auto px-6">
            <h2 class="text-2xl font-bold text-text-heading text-center mb-3">Watch: Your Personalized Next Steps</h2>
            <p class="text-gray-500 text-center mb-8">Gary breaks down exactly what your score means and what to do
                next.</p>
            <iframe id="youtubeEmbed" class="w-full rounded-2xl shadow-xl" style="aspect-ratio:16/9; border:0;" src=""
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </section>







    <!-- Footer -->
    <footer class="py-8 bg-white border-t border-gray-100">
        <div class="max-w-1200 mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">smart_toy</span>
                <span class="text-text-heading font-bold">xlGIANT</span>
            </div>
            <div class="text-sm text-gray-400">© 2026 xlGIANT. All rights reserved.</div>
        </div>
    </footer>

    <script>
        // ── Tier Config ──────────────────────────────────────────────────────────
        const tierConfig = {
            systemized: {
                label: 'Systemized',
                color: '#10B981',
                colorClass: 'tier-systemized',
                bgClass: 'tier-systemized-bg',
                btnClass: 'tier-systemized-btn',
                heading: "You're Already Ahead — Let's Build on Your Strong Foundation",
                subheading: "With a score of 12–24, your business shows few operational leaks. You're running lean and systemized — now it's time to layer in advanced automation to compound your edge.",
                ctaIcon: 'calendar_month',
                ctaHeading: 'Book Your Free Strategy Call',
                ctaBody: "You're in the top tier — your business is primed for advanced automation. Let's map out a custom strategy that could free up 15–20 more hours per week and accelerate your growth.",
                ctaButtonText: '📅 Book My Free Strategy Call',
                ctaButtonHref: '#',
                ctaNote: 'Limited spots available. No obligation.',
                youtubeId: 'VqDMZLR30x4?si=K0Xbxvtt3n8IqRwF'
            },
            hidden: {
                label: 'Hidden Leaks',
                color: '#F59E0B',
                colorClass: 'tier-hidden',
                bgClass: 'tier-hidden-bg',
                btnClass: 'tier-hidden-btn',
                heading: "You Have Hidden Leaks — Here's How to Plug Them",
                subheading: "With a score of 25–40, your business has real leaks hiding in plain sight. You're losing time, revenue, and energy to manual processes that can be fixed with the right systems.",
                ctaIcon: 'picture_as_pdf',
                ctaHeading: 'Download Your Free Automation Blueprint',
                ctaBody: "We've built a step-by-step PDF guide showing the exact automations that businesses at your stage should implement first — with tools, timelines, and expected ROI.",
                ctaButtonText: '📄 Download My Free Blueprint',
                ctaButtonHref: '#',
                ctaNote: 'Instant download. No credit card required.',
                youtubeId: 'AURRyVY_XX8?si=1eCFd-je6MR6YefC'
            },
            scaling: {
                label: 'Scaling Ceiling',
                color: '#EF4444',
                colorClass: 'tier-scaling',
                bgClass: 'tier-scaling-bg',
                btnClass: 'tier-scaling-btn',
                heading: "Your Business Has a Scaling Ceiling — Let's Break Through It",
                subheading: "With a score of 41–60, your business is heavily dependent on you and manual effort. The good news: every leak we identified is fixable. The right foundation now will pay dividends for years.",
                ctaIcon: 'school',
                ctaHeading: 'Enroll in Your Free 6-Week Automation Course',
                ctaBody: "We're giving you complimentary access to our 6-week Business Automation Foundations course. You'll go from zero to having your first automations running — step by step, no tech background required.",
                ctaButtonText: '🎓 Claim My Free 6-Week Course',
                ctaButtonHref: '#',
                ctaNote: 'Completely free. No credit card needed.',
                youtubeId: '7JJBs4thC3s?si=qFklrq6q_vszzb2O'
            }
        };

        // ── Load Results ─────────────────────────────────────────────────────────
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const stored = sessionStorage.getItem('assessmentResult');
            const data = stored ? JSON.parse(stored) : {};

            // Use sessionStorage as primary source (most reliable), URL params as fallback
            const score = data.totalPoints || parseInt(params.get('score')) || 0;
            const maxScore = data.maxPoints || 60;
            const tier = data.tier || params.get('tier') || 'scaling';

            // DEBUG — open browser console to verify
            console.log('Results page loaded:', { score, maxScore, tier, data });

            const config = tierConfig[tier] || tierConfig.scaling;

            // Heading & subheading
            document.getElementById('resultsHeading').textContent = config.heading;
            document.getElementById('resultsSubheading').textContent = config.subheading;

            // Name greeting
            if (data.firstName) {
                document.getElementById('nameGreeting').textContent =
                    `Great work, ${data.firstName}! Here's what your score means for your business.`;
            }



            // Score counter — counts up from 0 to raw score
            const scoreEl = document.getElementById('scoreNumber');
            scoreEl.style.color = config.color;
            let count = 0;
            const duration = 1800;
            const stepTime = score > 0 ? duration / score : duration;
            const interval = setInterval(() => {
                count += 1;
                if (count >= score) { count = score; clearInterval(interval); }
                scoreEl.textContent = count;
            }, stepTime);
            if (score === 0) scoreEl.textContent = '0';

            // Tier badge
            const badge = document.getElementById('tierBadge');
            badge.textContent = config.label;
            badge.style.color = config.color;
            badge.style.borderColor = config.color;
            badge.style.backgroundColor = config.color + '15';



            // YouTube embed
            document.getElementById('youtubeEmbed').src =
                `https://www.youtube.com/embed/${config.youtubeId}`;
        });

        // ── Share ────────────────────────────────────────────────────────────────
        function shareResults() {
            const params = new URLSearchParams(window.location.search);
            const score = params.get('score') || '0';
            const text = `I just scored ${score}/60 on the Business Automation Leak Assessment! Find out your score at xlGIANT.`;
            if (navigator.share) {
                navigator.share({ title: 'My Automation Leak Score', text, url: window.location.href });
            } else {
                navigator.clipboard.writeText(text + ' ' + window.location.href)
                    .then(() => alert('Results link copied to clipboard!'));
            }
        }
    </script>

</body>

</html>
